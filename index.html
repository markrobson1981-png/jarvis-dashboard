
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8">
<title>JARVIS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050d1b;color:#b9eaff;font-family:Arial,sans-serif;text-align:center;padding:25px 18px}
h1{font-size:34px;letter-spacing:9px;color:#62d9ff;margin-top:35px}
.sub{letter-spacing:4px;color:#568ba9;font-size:11px}
.circle{width:190px;height:190px;border:2px solid #38caff;border-radius:50%;margin:45px auto 25px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px #168acb,inset 0 0 25px #12608a}
.core{width:125px;height:125px;border:1px solid #7be5ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:3px;box-shadow:0 0 22px #168acb}
button{width:100%;max-width:340px;padding:17px;margin:9px auto;border:1px solid #38bde9;border-radius:8px;background:#0b2035;color:#a9eaff;font-size:15px;letter-spacing:1px}
button.primary{background:#0876a5;color:white;font-weight:bold}
.status{margin:28px auto;color:#67d8ad;font-size:12px;letter-spacing:2px}
#clock{font-size:26px;margin:12px}
footer{color:#45677e;font-size:10px;margin-top:40px;letter-spacing:2px}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
<div class="circle"><div class="core">ONLINE</div></div>
<div id="clock">--:--:--</div>
<div id="date"></div>
<div class="status">● SYSTEM READY</div>
<button class="primary" onclick="location.href='shortcuts://run-shortcut?name=JARVIS'">ACTIVATE JARVIS</button>
<button onclick="ask('Give me a concise briefing of today’s priorities and important things I should know.')">DAILY BRIEFING</button>
<button onclick="ask('Help me organise my tasks and plan my day.')">PLAN MY DAY</button>
<button onclick="ask('Act as my personal assistant. What can you help me with?')">ASSISTANT MODE</button>
<footer>JARVIS INTERFACE · PERSONAL ASSISTANT</footer>
<script>
function update(){
const d=new Date();
document.getElementById('clock').textContent=d.toLocaleTimeString('en-GB');
document.getElementById('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function ask(message){
if(navigator.clipboard){
navigator.clipboard.writeText(message).then(()=>alert('Command copied. Open JARVIS and paste it into the conversation.')).catch(()=>alert(message));
}else{alert(message);}
}
update();setInterval(update,1000);
</script>
</body>
</html>
