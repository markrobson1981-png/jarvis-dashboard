
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020814">
<title>J.A.R.V.I.S.</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at center, #092344 0%, #030d1d 48%, #01040a 100%);
  color: #bceeff;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

header {
  width: 100%;
  padding: 30px 15px 5px;
  text-align: center;
  letter-spacing: 7px;
}

header h1 {
  font-size: 27px;
  font-weight: 300;
  margin: 0;
  color: #c8f5ff;
  text-shadow: 0 0 18px #00bfff;
}

.subtitle {
  margin-top: 9px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #398dbb;
}

.reactor {
  width: min(88vw, 390px);
  aspect-ratio: 1;
  position: relative;
  margin: 35px auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(0, 195, 255, 0.65);
  box-shadow: 0 0 15px rgba(0, 174, 255, 0.2),
              inset 0 0 15px rgba(0, 174, 255, 0.1);
  transition: transform 0.12s ease, border-color 0.12s ease;
}

.ring1 {
  width: 100%;
  height: 100%;
  border-width: 2px;
  border-style: dashed;
  animation: rotate 30s linear infinite;
}

.ring2 {
  width: 85%;
  height: 85%;
  border-width: 2px;
  border-color: #168bd0;
  animation: rotateBack 22s linear infinite;
}

.ring3 {
  width: 68%;
  height: 68%;
  border: 3px dotted #20cfff;
  animation: rotate 14s linear infinite;
}

.ring4 {
  width: 51%;
  height: 51%;
  border: 2px solid #36dfff;
  box-shadow: 0 0 35px #008cff,
              inset 0 0 30px rgba(0, 145, 255, 0.4);
}

.core {
  width: 35%;
  height: 35%;
  border-radius: 50%;
  background: radial-gradient(circle, #e8ffff 0%, #49dfff 12%, #0079bd 38%, #03152b 75%);
  box-shadow: 0 0 25px #00bfff,
              0 0 65px #007bff,
              0 0 110px rgba(0, 150, 255, 0.6);
  animation: corePulse 3s ease-in-out infinite;
  z-index: 2;
}

.reactor.active .core {
  animation: corePulse 0.55s ease-in-out infinite;
}

.reactor.active .ring {
  border-color: #8af4ff;
  box-shadow: 0 0 25px #00cfff,
              inset 0 0 20px rgba(0, 200, 255, 0.35);
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes rotateBack {
  to { transform: rotate(-360deg); }
}

@keyframes corePulse {
  0%, 100% { transform: scale(0.94); filter: brightness(0.9); }
  50% { transform: scale(1.08); filter: brightness(1.4); }
}

.status {
  text-align: center;
  min-height: 42px;
  margin: 5px 0 18px;
  color: #69dfff;
  font-size: 12px;
  letter-spacing: 3px;
  text-shadow: 0 0 12px #00aaff;
}

.controls {
  width: min(88%, 360px);
  display: flex;
  flex-direction: column;
  gap: 13px;
}

button {
  padding: 16px;
  border: 1px solid #168fc5;
  border-radius: 5px;
  background: rgba(0, 85, 140, 0.18);
  color: #bceeff;
  font-size: 12px;
  letter-spacing: 3px;
  cursor: pointer;
  box-shadow: 0 0 15px rgba(0, 150, 255, 0.12);
}

button:active {
  background: rgba(0, 160, 255, 0.4);
}

button.primary {
  border-color: #42dfff;
  background: linear-gradient(90deg, #064b78, #087cb2, #064b78);
  box-shadow: 0 0 22px rgba(0, 190, 255, 0.3);
}

.info {
  margin: 25px 10px 35px;
  text-align: center;
  font-size: 10px;
  line-height: 2;
  letter-spacing: 2px;
  color: #397da2;
}

footer {
  margin-top: auto;
  padding: 15px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #245574;
}
</style>
</head>

<body>

<header>
  <h1>J.A.R.V.I.S.</h1>
  <div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
</header>

<div class="reactor" id="reactor">
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>
  <div class="ring ring4"></div>
  <div class="core"></div>
</div>

<div class="status" id="status">SYSTEM STANDBY</div>

<div class="controls">
  <button class="primary" onclick="activateJarvis()">
    ACTIVATE JARVIS
  </button>

  <button onclick="toggleMicrophone()">
    ENABLE AUDIO REACTOR
  </button>

  <button onclick="demoSpeaking()">
    TEST REACTOR ANIMATION
  </button>
</div>

<div class="info">
  PERSONAL AI INTERFACE<br>
  AUDIO REACTIVE VISUALISATION<br>
  SYSTEM ONLINE
</div>

<footer>
  STARK INDUSTRIES // J.A.R.V.I.S. INTERFACE
</footer>

<script>
const reactor = document.getElementById("reactor");
const statusText = document.getElementById("status");

let audioContext;
let analyser;
let microphone;
let animationFrame;
let demoTimer;

function activateJarvis() {
  window.location.href =
    "shortcuts://run-shortcut?name=JARVIS";
}

async function toggleMicrophone() {
  if (microphone) {
    microphone.getTracks().forEach(track => track.stop());
    microphone = null;
    cancelAnimationFrame(animationFrame);
    reactor.classList.remove("active");
    statusText.textContent = "SYSTEM STANDBY";
    return;
  }

  try {
    microphone = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();

    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;

    const source = audioContext.createMediaStreamSource(microphone);
    source.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    statusText.textContent = "AUDIO REACTOR ACTIVE";
    animateAudio(data);

  } catch (error) {
    statusText.textContent = "MICROPHONE ACCESS REQUIRED";
  }
}

function animateAudio(data) {
  analyser.getByteFrequencyData(data);

  const average =
    data.reduce((sum, value) => sum + value, 0) / data.length;

  const intensity = average / 128;

  reactor.classList.toggle("active", intensity > 0.08);

  const rings = document.querySelectorAll(".ring");

  rings.forEach((ring, index) => {
    const scale = 1 + intensity * (0.04 + index * 0.025);
    ring.style.transform =
      `scale(${scale}) rotate(${index * 12}deg)`;
  });

  animationFrame = requestAnimationFrame(() =>
    animateAudio(data)
  );
}

function demoSpeaking() {
  clearTimeout(demoTimer);

  reactor.classList.add("active");
  statusText.textContent = "JARVIS SPEAKING";

  let count = 0;

  function pulse() {
    if (count >= 12) {
      reactor.classList.remove("active");
      statusText.textContent = "SYSTEM STANDBY";

      document.querySelectorAll(".ring").forEach(ring => {
        ring.style.transform = "";
      });

      return;
    }

    const rings = document.querySelectorAll(".ring");

    rings.forEach((ring, index) => {
      const scale = 1 + Math.random() * 0.12;
      ring.style.transform = `scale(${scale})`;
    });

    count++;
    demoTimer = setTimeout(pulse, 180);
  }

  pulse();
}
</script>

</body>
</html>
